spring:
  application:
    name: eurekaserver

  config:
    import: "optional:configserver:http://localhost:8071/"



management:
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

  endpoints:
    web:
      exposure:
        include: "*"
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    prometheus:
      access: unrestricted

  metrics:
    tags:
      application: ${spring.application.name}
logging:
  level:
    com:
      bankApp:
        eurekaserver: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"

